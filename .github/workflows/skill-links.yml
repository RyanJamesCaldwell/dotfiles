name: Validate private skill links
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  skill-links:
    name: Skill links (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Test preview and opt-in linking with synthetic skills
        run: python3 tools/test-link-agent-skills.py
